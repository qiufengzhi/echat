<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="x-apple-disable-message-reformatting">
<title>重置你的 echat 密码</title>
</head>
<body style="margin:0;padding:0;background:#f4f5f7;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;-webkit-font-smoothing:antialiased;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#f4f5f7;padding:32px 12px;">
    <tr>
      <td align="center">
        <table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0" style="max-width:600px;width:100%;background:#ffffff;border-radius:12px;overflow:hidden;">
          <tr>
            <td style="padding:28px 40px 0;">
              <span style="font-size:20px;font-weight:700;color:#111827;letter-spacing:.5px;">echat</span>
            </td>
          </tr>
          <tr>
            <td style="padding:20px 40px 8px;">
              <h1 style="margin:0 0 16px;font-size:22px;line-height:1.4;color:#111827;">重置密码</h1>
              <p style="margin:0 0 12px;font-size:15px;line-height:1.7;color:#374151;">你好 {{username}}，我们收到了你的密码重置请求</p>
              <p style="margin:0 0 24px;font-size:15px;line-height:1.7;color:#374151;">请点击下方按钮设置新密码</p>
            </td>
          </tr>
          <tr>
            <td style="padding:0 40px 24px;">
              <table role="presentation" cellpadding="0" cellspacing="0" border="0">
                <tr>
                  <td style="border-radius:8px;background:#4f46e5;">
                    <a href="https://echat.qxbnx.cn/reset?token={{token}}" target="_blank" style="display:inline-block;padding:13px 32px;font-size:15px;font-weight:600;color:#ffffff;text-decoration:none;">重置密码</a>
                  </td>
                </tr>
              </table>
            </td>
          </tr>
          <tr>
            <td style="padding:0 40px 24px;">
              <p style="margin:0 0 6px;font-size:13px;line-height:1.6;color:#6b7280;">若按钮无法点击，请复制以下链接到浏览器打开</p>
              <p style="margin:0;font-size:13px;line-height:1.6;color:#4f46e5;word-break:break-all;">https://echat.qxbnx.cn/reset?token={{token}}</p>
            </td>
          </tr>
          <tr>
            <td style="padding:0 40px 28px;">
              <p style="margin:0;font-size:13px;line-height:1.6;color:#9ca3af;">链接 {{expire_minutes}} 分钟内有效，且仅可使用一次</p>
            </td>
          </tr>
          <tr>
            <td style="padding:20px 40px;background:#f9fafb;border-top:1px solid #f0f1f3;">
              <p style="margin:0;font-size:12px;line-height:1.6;color:#9ca3af;">若非你本人操作，请忽略本邮件，你的密码不会被更改<br>© {{year}} echat</p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
