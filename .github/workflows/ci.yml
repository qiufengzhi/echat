name: deploy # 工作流名称，会显示在 GitHub Actions 页面里

on:
  push: # 推送到主分支时自动触发构建和部署
    branches:
      - main
    paths:
      - ".github/workflows/ci.yml" # 工作流自身改动后也重新执行
      - "backend/**" # 后端代码变化时触发
      - "frontend/**" # 前端代码变化时触发
      - "agent/**" # Agent gRPC 服务变化时触发
      - "deploy/**" # 部署配置变化时触发

  workflow_dispatch: # 支持在 GitHub 页面上手动点击执行

permissions:
  contents: read # 允许读取仓库代码
  packages: write # 允许把镜像推送到 GHCR

concurrency:
  group: deploy-${{ github.ref }} # 同一分支只保留一个部署流程，避免并发覆盖
  # 必须为 false：设成 true 时，连续推送会把「正在推镜像」的部署直接砍掉，
  # 表现为日志末尾一行 "Error: The operation was canceled."（镜像推到一半、
  # manifest 未提交，deploy 作业也不会执行）。部署是串行语义，新提交排队即可。
  cancel-in-progress: false

env:
  GHCR_REGISTRY: ghcr.io # GitHub Container Registry，面向海外 / GitHub Actions 内部使用
  ACR_REGISTRY: crpi-cqc86h0ovlhhtcpq.cn-hangzhou.personal.cr.aliyuncs.com/axjj # 阿里云 ACR 个人版实例地址（含命名空间）

jobs:
  verify: # 先做基础校验，确保前后端都能正常构建/测试
    runs-on: ubuntu-latest # 使用 GitHub 提供的 Ubuntu Runner
    timeout-minutes: 10 # 防止校验步骤异常挂起耗尽配额

    steps:
      - name: Checkout repository # 拉取当前仓库代码
        uses: actions/checkout@v4

      - name: Set up Node.js # 准备前端构建所需的 Node 环境
        uses: actions/setup-node@v4
        with:
          node-version: 22 # 与前端 Dockerfile 使用的 Node LTS 版本保持一致
          cache: npm # 缓存 npm 依赖，加快重复构建
          cache-dependency-path: frontend/package-lock.json # 以前端锁文件作为缓存键

      - name: Verify frontend # 类型检查 + 完整构建，确保前端无编译错误
        working-directory: frontend
        run: |
          npm ci            # 按锁文件安装依赖，保证 CI 环境可复现
          npx tsc --noEmit  # 纯类型检查，不产出文件，比完整 build 更快
          npm run build     # 完整 Vite 构建，校验配置和打包结果

      - name: Set up Go # 准备后端测试所需的 Go 环境
        uses: actions/setup-go@v5
        with:
          go-version: "1.26" # 与后端 Dockerfile 和 go.mod 使用的 Go 版本保持一致

      - name: Install libopus # 安装原生 opus 头文件与库
        # 必须：sfu/audio_encoder_cgo.go 是默认且唯一的 Opus 编码器实现（CGo 链接系统 libopus，
        # WASM 版 jj11hh/opus 因越界写宿主内存已移除），无 build tag 兜底。
        # 缺 opus/opus.h 时 `go test ./...` 直接 fatal error: opus/opus.h: No such file or directory。
        # 与 backend/Dockerfile 里的 apk add opus-dev 对齐，保证 CI 与镜像构建环境一致。
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libopus-dev

      - name: Test backend # 运行后端测试，至少保证编译和包依赖正常
        working-directory: backend
        env:
          CGO_ENABLED: "1" # 必须开启 CGo，否则 sfu 包缺少 newOpusEncoderImpl 实现
        run: go test ./...

  build-and-push: # 校验通过后构建镜像并推送到可用 registry。每服务只构建一次，按需打多 registry tag
    needs: verify # 依赖 verify 成功，避免无效代码进入部署阶段
    runs-on: ubuntu-latest
    timeout-minutes: 60 # 三个服务构建 + GHCR↔ACR 同步总时长上限。
    # 30 分钟不够：ACR 在 GitHub 海外 Runner 上推送很慢（单层可重试数十秒），
    # 超时会在推送中途砍掉整个作业，日志只剩 "Error: The operation was canceled."。
    outputs:
      backend_image: ${{ steps.image-vars.outputs.backend_image }} # GHCR 后端镜像名
      frontend_image: ${{ steps.image-vars.outputs.frontend_image }} # GHCR 前端镜像名
      agent_image: ${{ steps.image-vars.outputs.agent_image }} # GHCR Agent 镜像名
      acr_backend_image: ${{ steps.image-vars.outputs.acr_backend_image }} # ACR 后端镜像名
      acr_frontend_image: ${{ steps.image-vars.outputs.acr_frontend_image }} # ACR 前端镜像名
      acr_agent_image: ${{ steps.image-vars.outputs.acr_agent_image }} # ACR Agent 镜像名
      image_tag: ${{ steps.image-vars.outputs.image_tag }} # 本次部署使用的镜像 tag
      ghcr_ok: ${{ steps.verify-pushes.outputs.ghcr_ok }} # GHCR 是否全部推送成功
      acr_ok: ${{ steps.verify-pushes.outputs.acr_ok }} # ACR 是否全部推送成功

    steps:
      - name: Checkout repository # 拉取代码，供 Docker 构建上下文使用
        uses: actions/checkout@v4

      - name: Prepare image names # 统一生成 GHCR 和 ACR 两套镜像名，全部转小写
        id: image-vars
        run: |
          owner="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          repo="$(basename "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          echo "backend_image=${GHCR_REGISTRY}/${owner}/${repo}-backend" >> "$GITHUB_OUTPUT"
          echo "frontend_image=${GHCR_REGISTRY}/${owner}/${repo}-frontend" >> "$GITHUB_OUTPUT"
          echo "agent_image=${GHCR_REGISTRY}/${owner}/${repo}-agent" >> "$GITHUB_OUTPUT"
          echo "acr_backend_image=${ACR_REGISTRY}/echat-backend" >> "$GITHUB_OUTPUT"
          echo "acr_frontend_image=${ACR_REGISTRY}/echat-frontend" >> "$GITHUB_OUTPUT"
          echo "acr_agent_image=${ACR_REGISTRY}/echat-agent" >> "$GITHUB_OUTPUT"
          echo "image_tag=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx # 启用 buildx 构建单平台镜像
        uses: docker/setup-buildx-action@v3

      # ---- 登录两个 registry，均为尽力而为 ----

      - name: Log in to GHCR # 登录 GitHub 容器仓库
        id: ghcr-login
        uses: docker/login-action@v3
        continue-on-error: true # GHCR 也可能偶发不可用，不阻塞流程
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to ACR # 登录阿里云容器镜像服务
        id: acr-login
        uses: docker/login-action@v3
        continue-on-error: true # ACR 从 GitHub Actions 海外网络访问不稳定
        with:
          registry: ${{ env.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      # ============================
      # 每服务先构建到 GHCR（GitHub Actions 同网络，可靠）
      # 再通过 docker pull/tag/push 把镜像同步到 ACR（尽力而为）
      # GHCR 推送失败整个步骤失败，ACR 推送失败不影响整体流程
      # ============================

      # ============ Backend ============

      - name: Build backend to GHCR # 构建并推送到 GHCR（同网段，几乎不会失败）
        id: build-backend
        if: steps.ghcr-login.outcome == 'success'
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.image-vars.outputs.backend_image }}:${{ steps.image-vars.outputs.image_tag }}
            ${{ steps.image-vars.outputs.backend_image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Sync backend to ACR # 从 GHCR 拉取再推送到 ACR，尽力而为。
        id: sync-backend-acr
        if: steps.acr-login.outcome == 'success' && (success() || failure())
        continue-on-error: true
        timeout-minutes: 20 # 单独限时：ACR 同步再慢也不能拖到整个作业超时被取消。
        run: |
          src="${{ steps.image-vars.outputs.backend_image }}:${{ steps.image-vars.outputs.image_tag }}"
          dst="${{ steps.image-vars.outputs.acr_backend_image }}"
          tag="${{ steps.image-vars.outputs.image_tag }}"
          # ACR 在 GitHub 海外 Runner 上不稳定，日志里常见单层 "Retrying in N seconds"。
          # 单次失败不代表镜像有问题，整步重试 3 次，避免一次抖动就丢掉这个 registry。
          for attempt in 1 2 3; do
            if docker pull "${src}" \
              && docker tag "${src}" "${dst}:${tag}" \
              && docker tag "${src}" "${dst}:latest" \
              && docker push "${dst}:${tag}" \
              && docker push "${dst}:latest"; then
              exit 0
            fi
            echo "WARN: ACR sync attempt ${attempt} failed, retrying in 10s..."
            sleep 10
          done
          echo "ERROR: ACR sync failed after 3 attempts: ${dst}"
          exit 1

      - name: Track backend results
        id: track-backend
        if: success() || failure()
        run: |
          echo "ghcr=${{ steps.build-backend.outcome }}" >> "$GITHUB_OUTPUT"
          echo "acr=${{ steps.sync-backend-acr.outcome }}" >> "$GITHUB_OUTPUT"

      # ============ Frontend ============

      - name: Build frontend to GHCR
        id: build-frontend
        if: steps.ghcr-login.outcome == 'success'
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.image-vars.outputs.frontend_image }}:${{ steps.image-vars.outputs.image_tag }}
            ${{ steps.image-vars.outputs.frontend_image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Sync frontend to ACR
        id: sync-frontend-acr
        if: steps.acr-login.outcome == 'success' && (success() || failure())
        continue-on-error: true
        timeout-minutes: 20 # 同上：同步慢不得拖垮整个作业。
        run: |
          src="${{ steps.image-vars.outputs.frontend_image }}:${{ steps.image-vars.outputs.image_tag }}"
          dst="${{ steps.image-vars.outputs.acr_frontend_image }}"
          tag="${{ steps.image-vars.outputs.image_tag }}"
          for attempt in 1 2 3; do
            if docker pull "${src}" \
              && docker tag "${src}" "${dst}:${tag}" \
              && docker tag "${src}" "${dst}:latest" \
              && docker push "${dst}:${tag}" \
              && docker push "${dst}:latest"; then
              exit 0
            fi
            echo "WARN: ACR sync attempt ${attempt} failed, retrying in 10s..."
            sleep 10
          done
          echo "ERROR: ACR sync failed after 3 attempts: ${dst}"
          exit 1

      - name: Track frontend results
        id: track-frontend
        if: success() || failure()
        run: |
          echo "ghcr=${{ steps.build-frontend.outcome }}" >> "$GITHUB_OUTPUT"
          echo "acr=${{ steps.sync-frontend-acr.outcome }}" >> "$GITHUB_OUTPUT"

      # ============ Agent ============

      - name: Build agent to GHCR
        id: build-agent
        if: steps.ghcr-login.outcome == 'success'
        uses: docker/build-push-action@v6
        with:
          context: ./agent
          file: ./agent/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.image-vars.outputs.agent_image }}:${{ steps.image-vars.outputs.image_tag }}
            ${{ steps.image-vars.outputs.agent_image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Sync agent to ACR
        id: sync-agent-acr
        if: steps.acr-login.outcome == 'success' && (success() || failure())
        continue-on-error: true
        timeout-minutes: 20 # 同上：同步慢不得拖垮整个作业。
        run: |
          src="${{ steps.image-vars.outputs.agent_image }}:${{ steps.image-vars.outputs.image_tag }}"
          dst="${{ steps.image-vars.outputs.acr_agent_image }}"
          tag="${{ steps.image-vars.outputs.image_tag }}"
          for attempt in 1 2 3; do
            if docker pull "${src}" \
              && docker tag "${src}" "${dst}:${tag}" \
              && docker tag "${src}" "${dst}:latest" \
              && docker push "${dst}:${tag}" \
              && docker push "${dst}:latest"; then
              exit 0
            fi
            echo "WARN: ACR sync attempt ${attempt} failed, retrying in 10s..."
            sleep 10
          done
          echo "ERROR: ACR sync failed after 3 attempts: ${dst}"
          exit 1

      - name: Track agent results
        id: track-agent
        if: success() || failure()
        run: |
          echo "ghcr=${{ steps.build-agent.outcome }}" >> "$GITHUB_OUTPUT"
          echo "acr=${{ steps.sync-agent-acr.outcome }}" >> "$GITHUB_OUTPUT"

      # ---- 校验：每个服务至少有一个 registry 推送成功 ----

      - name: Verify at least one registry succeeded # 检查各镜像推送结果，并输出可用 registry 标志。
        id: verify-pushes
        if: success() || failure() # 即使前面步骤有失败的也要执行校验。
        run: |
          # 收集各推送步骤的结果（skipped/failure 都视为未成功）
          b_ghcr="${{ steps.track-backend.outputs.ghcr }}"
          b_acr="${{ steps.track-backend.outputs.acr }}"
          f_ghcr="${{ steps.track-frontend.outputs.ghcr }}"
          f_acr="${{ steps.track-frontend.outputs.acr }}"
          a_ghcr="${{ steps.track-agent.outputs.ghcr }}"
          a_acr="${{ steps.track-agent.outputs.acr }}"

          failed=""

          # 每个服务必须至少推送到一个 registry
          if [ "$b_ghcr" != "success" ] && [ "$b_acr" != "success" ]; then
            failed="${failed} backend"
          fi
          if [ "$f_ghcr" != "success" ] && [ "$f_acr" != "success" ]; then
            failed="${failed} frontend"
          fi
          if [ "$a_ghcr" != "success" ] && [ "$a_acr" != "success" ]; then
            failed="${failed} agent"
          fi

          if [ -n "$failed" ]; then
            echo "ERROR: Failed to push to any registry:${failed}"
            exit 1
          fi

          # 判断每个 registry 是否全部镜像都推送成功
          ghcr_ok=false
          acr_ok=false
          if [ "$b_ghcr" = "success" ] && [ "$f_ghcr" = "success" ] && [ "$a_ghcr" = "success" ]; then
            ghcr_ok=true
          fi
          if [ "$b_acr" = "success" ] && [ "$f_acr" = "success" ] && [ "$a_acr" = "success" ]; then
            acr_ok=true
          fi

          echo "ghcr_ok=${ghcr_ok}" >> "$GITHUB_OUTPUT"
          echo "acr_ok=${acr_ok}" >> "$GITHUB_OUTPUT"
          echo "GHCR all ok: ${ghcr_ok}, ACR all ok: ${acr_ok}"

  deploy: # 镜像推送完成后，通过 SSH 到服务器拉取并重启服务。优先 ACR，不可用时 fallback 到 GHCR。
    needs: build-and-push # 依赖镜像构建完成（至少一个 registry 推送成功）。
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') # 仅 main 分支和 tag 触发部署，其他分支不触发。
    runs-on: ubuntu-latest
    timeout-minutes: 15 # 部署超时兜底。

    steps:
      - name: Checkout repository # 拉取仓库，供后续上传部署文件使用。
        uses: actions/checkout@v4

      - name: Ensure deploy directory exists # 先在服务器上创建部署目录以及 Nginx/证书子目录。
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }} # 目标服务器地址。
          username: ${{ secrets.DEPLOY_USER }} # SSH 登录用户名。
          password: ${{ secrets.DEPLOY_PASSWORD }} # SSH 登录密码，适用于当前服务器的密码登录方式。
          port: ${{ secrets.DEPLOY_PORT || '22' }} # SSH 端口，未配置时默认 22。
          script_stop: true # 远端命令一旦失败，立刻终止步骤。
          script: mkdir -p "${{ secrets.DEPLOY_PATH }}/nginx" "${{ secrets.DEPLOY_PATH }}/backend" # 创建部署目录（含迁移目录父级），避免后续上传失败。

      - name: Upload production compose file # 把生产 compose 文件和 HTTPS 网关配置上传到服务器部署目录。
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }} # 目标服务器地址。
          username: ${{ secrets.DEPLOY_USER }} # SSH 登录用户名。
          password: ${{ secrets.DEPLOY_PASSWORD }} # SSH 登录密码，适用于当前服务器的密码登录方式。
          port: ${{ secrets.DEPLOY_PORT || '22' }} # SSH 端口。
          source: "deploy/docker-compose.prod.yml,deploy/nginx/gateway.prod.conf" # 上传 compose 文件与 Nginx 生产配置
          target: ${{ secrets.DEPLOY_PATH }} # 服务器上的目标目录。
          strip_components: 1 # 去掉本地 deploy/ 目录层级，保留 nginx 子目录结构。
          overwrite: true # 如果目标文件已存在，则直接覆盖。

      - name: Upload database migrations # 把 Atlas 版本化迁移目录（含 atlas.sum）上传到服务器。
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }} # 目标服务器地址。
          username: ${{ secrets.DEPLOY_USER }} # SSH 登录用户名。
          password: ${{ secrets.DEPLOY_PASSWORD }} # SSH 登录密码，适用于当前服务器的密码登录方式。
          port: ${{ secrets.DEPLOY_PORT || '22' }} # SSH 端口。
          # 必须与 compose 里 migrate 服务的只读挂载 ./backend/migrations 完全对应。
          # 为什么必须单独上传：迁移 SQL 编译期内嵌进后端二进制，启动时 store.Migrate 拿
          # 「内嵌最新版本」比对「库里已应用版本」。若服务器上的迁移目录停留在旧版本，
          # migrate 服务无新文件可 apply（幂等退出 0，看起来一切正常），后端却因漂移
          # FATAL 并 restart: unless-stopped 无限崩溃重启。atlas.sum 必须一并上传，
          # 否则 atlas 校验目录哈希失败、迁移根本跑不起来。
          source: "backend/migrations"
          target: ${{ secrets.DEPLOY_PATH }}/backend # 落到 <部署目录>/backend/migrations
          # strip_components 必须=1：从 source「backend/migrations」去掉第一级 backend/，
          # 剩 migrations/，拼到 target/backend → backend/migrations（与 compose migrate
          # 服务的只读挂载 ./backend/migrations 对齐）。
          # strip=0 会多一层落到 backend/backend/migrations（migrate 挂载不到），migrate
          # 幂等退出 0、后端 store.Migrate 却因漂移 FATAL——2026-09-20 线上故障即此。
          strip_components: 1
          overwrite: true # 每次部署覆盖为仓库当前版本。

      - name: Pull and restart services # 在服务器上登录 ACR、拉镜像并重启所有服务。
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }} # 目标服务器地址。
          username: ${{ secrets.DEPLOY_USER }} # SSH 登录用户名。
          password: ${{ secrets.DEPLOY_PASSWORD }} # SSH 登录密码，适用于当前服务器的密码登录方式。
          port: ${{ secrets.DEPLOY_PORT || '22' }} # SSH 端口。
          script_stop: true # 任一命令失败时立即终止整个部署。
          command_timeout: 20m # 串行拉取（COMPOSE_PARALLEL_LIMIT=1）+ 失败重试一次，耗时比并发更久，放宽到 20 分钟。
          script: |
            set -eu # 遇到未定义变量或命令失败时立即退出。
            cd "${{ secrets.DEPLOY_PATH }}" # 进入服务器上的部署目录。

            # 写 .env 的镜像变量。必须定义在 try_deploy 之外：ACR 分支若登录失败会直接
            # return，定义写在分支里的话 GHCR 回退就调到未定义函数（set -e 下整段退出）。
            write_image_env() {
              # 只覆盖四个镜像变量，必须保留运维手工写入的基础设施凭据
              # （POSTGRES_PASSWORD / REDIS_PASSWORD / SPICEDB_PRESHARED_KEY）：
              # 直接 cat > .env 会整份清空，compose 随即回退 ${VAR:-默认值}，
              # 与服务器 backend/config.yaml 里填的强密码不一致 → 后端连不上库或授权被拒。
              touch .env
              grep -v -E '^(BACKEND_IMAGE|FRONTEND_IMAGE|AGENT_IMAGE|IMAGE_TAG)=' .env > .env.keep || true
              mv .env.keep .env
              cat >> .env <<EOF
            BACKEND_IMAGE=$1
            FRONTEND_IMAGE=$2
            AGENT_IMAGE=$3
            IMAGE_TAG=$4
            EOF
            }

            # 尝试拉取并部署：先试 ACR（国内快），失败则 fallback 到 GHCR。
            try_deploy() {
              local registry="$1"  # "acr" or "ghcr"
              local tag="${{ needs.build-and-push.outputs.image_tag }}"

              echo "Trying to deploy from ${registry}..."

              if [ "$registry" = "acr" ]; then
                echo "Logging in to ACR..."
                echo "${{ secrets.ACR_PASSWORD }}" | docker login "${{ env.ACR_REGISTRY }}" -u "${{ secrets.ACR_USERNAME }}" --password-stdin || {
                  echo "ERROR: docker login to ACR failed (exit=$?). Check ACR_USERNAME/ACR_PASSWORD or network."
                  return 1
                }
                write_image_env \
                  "${{ needs.build-and-push.outputs.acr_backend_image }}" \
                  "${{ needs.build-and-push.outputs.acr_frontend_image }}" \
                  "${{ needs.build-and-push.outputs.acr_agent_image }}" \
                  "${tag}"
              else
                echo "Logging in to GHCR..."
                echo "${{ secrets.GITHUB_TOKEN }}" | docker login "${{ env.GHCR_REGISTRY }}" -u "${{ github.actor }}" --password-stdin || {
                  echo "ERROR: docker login to GHCR failed (exit=$?). Check if server can reach ghcr.io."
                  return 1
                }
                write_image_env \
                  "${{ needs.build-and-push.outputs.backend_image }}" \
                  "${{ needs.build-and-push.outputs.frontend_image }}" \
                  "${{ needs.build-and-push.outputs.agent_image }}" \
                  "${tag}"
              fi

              echo "Pulling images..."

              # 为什么单独包一个函数并串行拉取：
              # docker compose pull 默认并发拉取多个镜像。当多个镜像共享同一个基础层时，
              # 并发"拆包"同一层会偶发竞态，表现为
              #   failed to register layer: invalid hardlink target "/usr/share/zoneinfo/Africa/Abidjan"
              # （层 tar 里的硬链接记录找不到目标文件）。这是 Docker 的已知偶发问题，
              # 镜像本身没坏，单独重拉同一镜像是正常的。
              # COMPOSE_PARALLEL_LIMIT=1 强制一个一个拉，从根上避开并发竞态。
              pull_images() {
                # 第一遍全量拉取（含 postgres/nats/redis/spicedb/atlas/nginx 等基础设施与
                # 一次性工具镜像），失败不阻断：这些镜像几乎不变，不该由它们决定本次部署成败。
                # 反例教训：早先这里整段 pull 失败就判定 registry 不可用，于是 atlas 之类
                # 工具镜像偶发拉不动时，已经拉到的业务镜像也跟着不上线，白跑一轮部署。
                COMPOSE_PARALLEL_LIMIT=1 docker compose --env-file .env -f docker-compose.prod.yml pull || true

                # 第二遍只严格校验本次要上线的三个业务镜像：只有它们拉到才认为可部署。
                COMPOSE_PARALLEL_LIMIT=1 docker compose --env-file .env -f docker-compose.prod.yml pull backend frontend agent
              }

              # 应用数据库迁移（幂等，可重复执行）：必须在 up 之前跑完。
              # 为什么不能只依赖 backend 的 depends_on: service_completed_successfully：
              # 1) up -d 不保证重跑已成功退出的一次性容器（配置哈希未变时直接跳过），
              #    新增迁移文件可能压根没被 apply；
              # 2) 即便跑了，也不改变校验顺序——后端启动期 store.Migrate 拿「二进制内嵌的
              #    最新迁移版本」比对库里已应用版本，落后即 FATAL 退出，被 restart:
              #    unless-stopped 拉起后再次 FATAL，形成崩溃重启循环（本次线上故障表现）。
              # 这里显式 run --rm 一次，迁移失败即让本 registry 的部署失败，避免带着
              # 漂移的 schema 把后端拉起来刷日志。
              migrate_db() {
                # 先清掉上一轮 up 留下的一次性 migrate 容器：该服务声明了固定
                # container_name（echat-migrate），残留容器可能让 run 报名字冲突。
                # 删除后 up -d 会重建并重跑一次，迁移幂等，无副作用。
                docker compose --env-file .env -f docker-compose.prod.yml rm -f migrate || true
                # 失败必须上抛：早先这里不判返回码，atlas 拉不动镜像 / 目录哈希校验失败时
                # 迁移静默跳过，后端却照常 up，于是带着漂移 schema 崩溃重启（2026-09-20 线上故障）。
                if ! docker compose --env-file .env -f docker-compose.prod.yml run --rm migrate; then
                  echo "ERROR: 数据库迁移执行失败，终止本次部署（不让后端带漂移 schema 起来）"
                  return 1
                fi
                verify_migration
              }

              # 迁移后复核：按与后端 store.Migrate 相同的口径比对「目录内最新迁移版本」与
              # 「库里 atlas_schema_revisions 已应用版本」。仅靠 run --rm migrate 的退出码不够：
              # atlas 在目录落后时也会幂等退出 0（无事可做即成功），只有比对版本才能发现
              # 「迁移目录没上传 / apply 到了别的库」这类静默漂移。
              verify_migration() {
                local latest applied
                latest=$(ls backend/migrations/*.sql 2>/dev/null | xargs -n1 basename | cut -d_ -f1 | sort | tail -1)
                if [ -z "$latest" ]; then
                  echo "ERROR: 服务器上 backend/migrations 为空，无法校验迁移版本"
                  return 1
                fi
                # POSTGRES_* 来自部署目录的 .env，缺省值与 compose 里 migrate 服务保持一致
                set -a; . ./.env 2>/dev/null || true; set +a
                applied=$(docker compose --env-file .env -f docker-compose.prod.yml exec -T postgres \
                  psql -U "${POSTGRES_USER:-echat}" -d "${POSTGRES_DB:-echat}" -tAc \
                  "SELECT version FROM atlas_schema_revisions.atlas_schema_revisions WHERE type = 2 ORDER BY executed_at DESC LIMIT 1" \
                  | tr -d '[:space:]')
                if [ "$applied" != "$latest" ]; then
                  echo "ERROR: 迁移复核失败：库内已应用 ${applied:-<空>}，迁移目录最新 ${latest}——schema 仍漂移"
                  return 1
                fi
                echo "迁移复核通过：已应用 ${applied}"
              }

              # 启动栈：先确保 compose 网络存在，再 up。
              # 已知故障：若 echat 的默认网络被删（docker system prune / network prune 都会清掉
              # "没有被运行中的容器使用"的网络），残留容器仍持有旧网络 ID，up 在 start 阶段直接报
              #   failed to set up container networking: network <id> not found
              # 且 compose 不一定会重建这些容器（配置哈希未变），于是整个部署卡死。
              # 这里做两级兜底：先 --force-recreate 让所有容器按当前网络重建；
              # 仍失败则 down（不带 -v，命名卷保留，数据不丢）后重新 up，网络与容器全部重建。
              up_stack() {
                if docker compose --env-file .env -f docker-compose.prod.yml up -d --remove-orphans; then
                  return 0
                fi

                echo "WARN: docker compose up failed, retrying with --force-recreate..."
                if docker compose --env-file .env -f docker-compose.prod.yml up -d --remove-orphans --force-recreate; then
                  return 0
                fi

                echo "WARN: still failing, recreating project networks and containers..."
                echo "--- docker networks for diagnosis ---"
                docker network ls || true
                echo "-------------------------------------"
                docker compose --env-file .env -f docker-compose.prod.yml down --remove-orphans --timeout 30 || true
                docker compose --env-file .env -f docker-compose.prod.yml up -d --remove-orphans
              }

              # 第一次拉取成功：先应用迁移，再重启服务
              if pull_images; then
                migrate_db || return 1
                up_stack
                return 0
              fi

              # 第一次失败：清理悬空镜像层后重试一次。
              # 注意：这里必须用 docker image prune，不能用 docker system prune。
              # system prune 会连带删除"未被运行中容器使用"的网络和已停止的容器，
              # 本项目网络一旦被删，随后 up 就会报 network not found（正是本次故障根因）。
              # 只 prune 悬空镜像（不加 -a），既腾出层缓存空间，又不删正在使用的旧镜像（回滚更快）。
              echo "WARN: first pull failed (registry=${registry}), cleaning dangling layers and retrying once..."
              docker image prune -f || true

              if pull_images; then
                migrate_db || return 1
                up_stack
                return 0
              fi

              # 两次都失败才判定该 registry 不可用，并打印服务器 Docker 环境信息便于定位
              # （存储驱动不是 overlay2、磁盘/inode 写满，都会让层"拆包"失败）
              echo "ERROR: docker compose pull failed twice (registry=${registry})."
              echo "--- docker env for diagnosis ---"
              docker version || true
              docker info 2>/dev/null | grep -i -A2 "Storage Driver" || true
              df -h /var/lib/docker || true
              echo "--------------------------------"
              return 1
            }

            acr_ok="${{ needs.build-and-push.outputs.acr_ok }}"
            ghcr_ok="${{ needs.build-and-push.outputs.ghcr_ok }}"

            deployed=false

            if [ "$acr_ok" = "true" ]; then
              if try_deploy acr; then
                deployed=true
                echo "Deployed successfully from ACR."
              else
                echo "ACR pull failed, will try GHCR as fallback."
              fi
            fi

            if [ "$deployed" = false ] && [ "$ghcr_ok" = "true" ]; then
              if try_deploy ghcr; then
                deployed=true
                echo "Deployed successfully from GHCR."
              else
                echo "GHCR pull also failed."
              fi
            fi

            if [ "$deployed" = false ]; then
              echo "ERROR: Failed to deploy from any registry."
              exit 1
            fi
