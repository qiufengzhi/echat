log_format timed '$remote_addr - $remote_user [$time_local] '
                 '"$request" $status $body_bytes_sent '
                 'rt=$request_time urt=$upstream_response_time '
                 '"$http_referer" "$http_user_agent"';

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # 访问日志增加请求耗时，方便确认 /ws 是否在固定时间后被代理层断开。
    access_log /var/log/nginx/access.log timed;

    # SPA 路由支持
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API 代理到后端
    # proxy_pass 后面「带不带 URI（也就是结尾斜杠）」语义差别：
    #   1) 带 URI：proxy_pass http://backend:8080/;
    #      nginx 会做「前缀替换」——把本 location 匹配到的那段（/api/）替换成 /，
    #      于是 /api/v1/auth/login 到后端变成 /v1/auth/login，
    #      而后端注册的是「带 /api 前缀」的路由（backend/authn/routes.go），直接匹配不上。
    #   2) 不带 URI：proxy_pass http://backend:8080;
    #      nginx 原样透传完整请求 URI，/api/v1/auth/login 到后端还是 /api/v1/auth/login。
    # 后端路由带 /api 前缀，所以这里必须写成「不带结尾斜杠」的形式。
    # 类比：就像后端网关里的 StripPrefix，加了就会把前缀吃掉，两边必须约定一致。
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # WebSocket 代理
    location /ws {
        proxy_pass http://backend:8080/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
}
