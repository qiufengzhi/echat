syntax = "proto3";

package llm;

option go_package = "backend/proto/llm";

// LLMService 是 Go 后端与 Python Agent 之间的对话服务
// 一轮对话一次 Generate 调用：请求一次，响应流式返回
// 取消由客户端取消该轮调用的 context 表达，超时由 RPC deadline 表达
service LLMService {
  // Generate 处理一轮对话，按事件流式返回本轮结果
  rpc Generate(TurnRequest) returns (stream TurnResponse);
  // CloseSession 通知 Agent 释放会话，房间解散、客户端离开、Agent 关闭时调用
  rpc CloseSession(CloseSessionRequest) returns (CloseSessionResponse);
  // HealthCheck 健康检查
  rpc HealthCheck(HealthCheckRequest) returns (HealthCheckResponse);
}

// TurnRequest 一轮对话的请求
message TurnRequest {
  string session_id = 1; // 会话 ID，同一会话的轮次在 Agent 侧串行处理
  string room_id = 2;    // 房间 ID
  string client_id = 3;  // 客户端 ID，与房间 ID 组成会话 ID
  string user_text = 4;  // 用户输入文本，取自 ASR 句末结果
  string turn_id = 5;    // 轮次 ID，跨 Go、Agent、TTS 关联同一轮
  int64 seq = 6;         // 轮次序号，同一会话内由调用方递增
  string user_id = 7;    // 说话用户的业务 ID，预留做个性化
}

// TurnResponse 一轮对话的响应事件，同一轮的所有事件共享 turn_id
message TurnResponse {
  string session_id = 1;      // 会话 ID
  string room_id = 2;         // 房间 ID
  string client_id = 3;       // 客户端 ID
  string turn_id = 4;         // 轮次 ID
  string response_text = 5;   // 回复文本片段，流式返回
  bool is_final = 6;          // 是否为本轮最后一个事件
  int64 seq = 7;              // 对应请求的轮次序号
  string error_code = 8;      // 错误码，空表示正常
  string event_type = 9;      // 事件类型，取值 token、tool_call、tool_result
  string tool_call_id = 10;   // 工具调用 ID
  string tool_name = 11;      // 工具名称
  string tool_arguments = 12; // 工具参数 JSON
  string tool_result = 13;    // 工具结果文本
}

// CloseSessionRequest 会话释放请求
message CloseSessionRequest {
  string session_id = 1; // 要释放的会话 ID
  string reason = 2;     // 释放原因，取值 room_closed、client_left、agent_shutdown
}

// CloseSessionResponse 会话释放结果
message CloseSessionResponse {
  bool closed = 1; // 会话是否存在并被释放
}

// HealthCheckRequest 健康检查请求
message HealthCheckRequest {
  string service = 1; // 可选的服务名
}

// HealthCheckResponse 健康检查响应
message HealthCheckResponse {
  // ServingStatus 服务状态
  enum ServingStatus {
    UNKNOWN = 0;     // 未知
    SERVING = 1;     // 正常服务
    NOT_SERVING = 2; // 不可服务
    DEGRADED = 3;    // 降级服务
  }
  ServingStatus status = 1; // 服务状态
  int32 active_sessions = 2; // 当前活跃会话数
  string provider_name = 3;  // 上游模型供应商名
  double uptime_seconds = 4; // 已运行秒数
}
