# eChat 本地开发环境 Docker Compose
#
# 当前起 PostgreSQL + NATS(JetStream) + Redis + SpiceDB，外加一次性 Atlas 迁移服务
# 启动：docker compose -f deploy/docker-compose.dev.yml up -d
# 迁移：docker compose -f deploy/docker-compose.dev.yml run --rm migrate
# 端口避开生产栈占用的 8080/5432，PostgreSQL 用 5433，NATS 用 4222，Redis 用 6379，SpiceDB gRPC 用 50051

services:
  postgres:
    container_name: echat-dev-postgres
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: echat        # 开发库用户
      POSTGRES_PASSWORD: echat    # 开发库密码，仅本地开发，生产以环境变量覆盖
      POSTGRES_DB: echat_dev      # 开发库名
    ports:
      - "5433:5432"               # 宿主机 5433 -> 容器 5432，避开生产默认 5432
    volumes:
      - echat_dev_pgdata:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro # 首次初始化数据卷时自动创建附属库（SpiceDB 元组存储库）
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U echat -d echat_dev"]
      interval: 5s
      timeout: 3s
      retries: 10

  nats:
    container_name: echat-dev-nats
    image: nats:2-alpine
    restart: unless-stopped
    command: ["-js", "-m", "8222"]  # 开启 JetStream，启用 8222 监控 HTTP
    ports:
      - "4222:4222"                 # NATS 客户端连接（relay 发布 / 消费者订阅）
      - "8222:8222"                 # JetStream 监控与健康检查
    volumes:
      - echat_dev_natsdata:/data    # 事件流持久化目录

  redis:
    container_name: echat-dev-redis
    image: docker.m.daocloud.io/library/redis:7-alpine  # 本机走 DaoCloud 加速器路径拉取，Docker Hub 直连不可达
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]  # 开启 AOF 持久化，重启不丢热状态
    ports:
      - "6379:6379"                 # 登录限流 / 在线热状态读写
    volumes:
      - echat_dev_redisdata:/data   # 数据 AOF 持久化目录
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # 一次性（run --rm）Atlas 版本化迁移服务：对 dev 库 apply backend/migrations
  # 用法：docker compose -f deploy/docker-compose.dev.yml run --rm migrate
  migrate:
    container_name: echat-dev-migrate
    image: docker.m.daocloud.io/arigaio/atlas:latest  # 本机走 DaoCloud 加速器路径拉取
    restart: "no"
    command:
      - migrate
      - apply
      - --dir
      - file:///migrations
      - --url
      - postgres://echat:echat@postgres:5432/echat_dev?sslmode=disable
    volumes:
      - ../backend/migrations:/migrations:ro  # 挂载版本化迁移目录，只读
    depends_on:
      postgres:
        condition: service_healthy

  # SpiceDB(Zanzibar) 对象级授权服务：关系元组存储复用 Postgres（echat_spicedb 库），不加新存储
  spicedb:
    container_name: echat-dev-spicedb
    image: ghcr.io/authzed/spicedb:latest
    restart: unless-stopped
    command: ["serve"]
    ports:
      - "50051:50051"                 # gRPC 鉴权接口（control-plane 权限裁决）
    environment:
      SPICEDB_GRPC_PRESHARED_KEY: dev-secret-local  # 与 config.yaml 默认一致
      SPICEDB_DATASTORE_ENGINE: postgres            # 复用同一 Postgres，spicedb 自建库表
      SPICEDB_DATASTORE_CONN_URI: postgres://echat:echat@postgres:5432/echat_spicedb?sslmode=disable
      SPICEDB_DATASTORE_REVISION_QUANTIZATION: 1s   # 降低可读版本推进粒度，控制面强一致读等待上限
      SPICEDB_LOG_LEVEL: info
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  echat_dev_pgdata:
  echat_dev_natsdata:
  echat_dev_redisdata: