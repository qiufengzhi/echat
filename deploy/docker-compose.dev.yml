# eChat 原生开发叠加层（在共享基础设施 base 之上）
#
# 只做两件事：把基础设施端口暴露到宿主、固定开发库名与数据卷。
# 业务进程（backend / agent）在宿主机原生跑，直连 127.0.0.1。
#
# 启动：docker compose -f deploy/docker-compose.base.yml -f deploy/docker-compose.dev.yml up -d
# 迁移：cd backend && go run . migrate（迁移 SQL 已内嵌后端二进制，方案 A，不用 atlas 容器）
# 端口避开生产栈：PostgreSQL 5433、NATS 4222/8222、Redis 6379、SpiceDB gRPC 50051
name: echat-dev

services:
  postgres:
    container_name: echat-dev-postgres
    environment:
      POSTGRES_DB: echat_dev # 开发库名，与 backend/config.yaml 的 database.name 一致
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U echat -d echat_dev"] # 库名随本层覆盖，须同步
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "5433:5432" # 宿主 5433 避开生产默认 5432

  nats:
    container_name: echat-dev-nats
    ports:
      - "4222:4222" # NATS 客户端连接
      - "8222:8222" # JetStream 监控与健康检查

  redis:
    container_name: echat-dev-redis
    ports:
      - "6379:6379" # 登录限流 / 在线热状态读写

  spicedb-db-init:
    container_name: echat-dev-spicedb-db-init

  spicedb-migrate:
    container_name: echat-dev-spicedb-migrate

  spicedb:
    container_name: echat-dev-spicedb
    ports:
      - "50051:50051" # gRPC 鉴权接口

volumes:
  pgdata:
    name: echat_dev_pgdata # 固定卷名，复用既有开发数据
  natsdata:
    name: echat_dev_natsdata
  redisdata:
    name: echat_dev_redisdata
