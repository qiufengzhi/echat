# 处理 WebSocket 升级时所需的 Connection 头。
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    listen [::]:80;
    server_name echat.qxbnx.cn;

    # Let's Encrypt HTTP-01 域名验证专用路径（certbot webroot 模式）。
    # 原理：certbot 在宿主机 /var/www/certbot 目录写入一次性验证文件，
    #       Let's Encrypt 会来请求 http://echat.qxbnx.cn/.well-known/acme-challenge/xxx，
    #       Nginx 直接把文件原样返回即可完成验证，全程不需要占用 80 端口。
    # 注意：^~ 表示命中后不再匹配其他 location；必须放在 location / 之前，
    #       这样验证请求不会走进下面的 301 跳转逻辑。
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    # 其余所有明文 HTTP 请求都跳转到 HTTPS，保证浏览器处于安全上下文。
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name echat.qxbnx.cn;

    # 证书文件来自宿主机挂载的 ./ssl 目录。
    ssl_certificate /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # 对浏览器声明后续优先使用 HTTPS。
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        proxy_pass http://frontend:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 300s; # 读超时，上游服务器在这个时间内没有响应则断开
    }
}
