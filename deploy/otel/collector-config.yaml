# OTel Collector（contrib）：应用唯一 OTLP 出口，分流 Tempo / Prometheus / Loki
# 职责：尾采样（traces）、PII 兜底剥离、扇出
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
  attributes/pii:
    actions:
      - key: echat.pii.*
        action: delete
      - key: lk.pii.*
        action: delete
  tail_sampling:
    policies:
      - name: errors
        type: status_code
        status_code:
          status_codes: [ERROR]
      - name: slow-e2e
        type: latency
        latency:
          threshold_ms: 2000
      - name: prob
        type: probabilistic
        probabilistic:
          sampling_percentage: 10

exporters:
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true
  prometheus:
    endpoint: 0.0.0.0:8889
    add_metric_suffixes: false
  otlphttp/loki-logs:
    # otlphttp 会自动追加 /v1/logs，故 endpoint 只给基底 /otlp → 实际请求 /otlp/v1/logs
    endpoint: http://loki:3100/otlp
    tls:
      insecure: true

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch, attributes/pii, tail_sampling]
      exporters: [otlp/tempo]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [prometheus]
    logs:
      receivers: [otlp]
      processors: [attributes/pii, batch]
      exporters: [otlphttp/loki-logs]