# OTel Collector（contrib）：应用唯一 OTLP 出口，分流 Tempo / Prometheus / Loki
# 职责：尾采样（traces）、PII 兜底剥离、扇出
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
  pii:
    actions:
      - key: echat.pii.*
        action: delete
      - key: lk.pii.*
        action: delete
      - key: gen_ai.prompt
        action: delete
  tail_sampling:
    policies:
      - name: errors
        type: status_code
        status_code:
          status_codes: [ERROR]
      - name: slow-e2e
        type: latency
        latency:
          threshold_ms: 2000
      - name: prob
        type: probabilistic
        probabilistic:
          sampling_percentage: 10

exporters:
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true
  prometheus:
    endpoint: 0.0.0.0:8889
    add_metric_suffixes: false
  loki:
    endpoint: http://loki:3100/loki/api/v1/push
    tls:
      insecure: true
    default_labels_enabled:
      exporter: true

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch, pii, tail_sampling]
      exporters: [otlp/tempo]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [prometheus]
    logs:
      receivers: [otlp]
      processors: [pii, batch]
      exporters: [loki]