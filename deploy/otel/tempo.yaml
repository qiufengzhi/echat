# Tempo：单机 local-blocks，收 OTLP 存 trace
# （metrics_generator 的 span→metric 因当前 tempo 版本 schema 差异暂关，RED 由 Collector→Prometheus 指标承担）
server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

storage:
  trace:
    backend: local
    local:
      path: /var/tempo/blocks
    wal:
      path: /var/tempo/wal