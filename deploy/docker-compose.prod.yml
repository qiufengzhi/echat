# eChat 生产环境 Docker Compose 配置
# 镜像名等变量由 CI 写入 .env（服务器首次部署先 touch .env 占位）
# 基础设施（PostgreSQL + NATS + Redis + SpiceDB）与业务服务在同一个 compose 内，单机一键起全栈
#
# 启动命令：
#   docker compose --env-file .env -f docker-compose.prod.yml up -d

services:
  postgres: # 持久层：账号/会话 + outbox_events + 房间事实表，后端全部读写入口
    container_name: echat-postgres
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-echat}      # 连接用户名，可通过 .env 覆盖
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-echat}  # 连接密码,生产用 .env 覆盖,且 backend config.yaml 的 database.password 须与此一致
      POSTGRES_DB: ${POSTGRES_DB:-echat}          # 默认库名
    volumes:
      - echat_prod_pgdata:/var/lib/postgresql/data # 数据持久化，重建容器不丢数据
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-echat} -d ${POSTGRES_DB:-echat}"]
      interval: 5s
      timeout: 3s
      retries: 10
    # 不映射宿主端口：后端经 compose 内部网络以 postgres:5432 访问，减小生产攻击面

  nats: # 事件骨干：事务性 Outbox 向 JetStream 投递的落点，事件流持久化留痕
    container_name: echat-nats
    image: nats:2-alpine
    restart: unless-stopped
    command: ["-js", "-m", "8222", "-sd", "/data"] # 开启 JetStream，8222 为监控/健康检查端口
    # -sd /data 必须显式指定：nats-server 未配置 store_dir 时 JetStream 默认落 /tmp，
    # 容器重建即丢事件流（已挂的 echat_prod_natsdata 卷会变成空挂），
    # outbox 投递过的事件与依赖事件重建的投影读模型都会随之丢失。
    volumes:
      - echat_prod_natsdata:/data # 事件流持久化目录，重启不丢已投递事件
    # 不映射宿主端口：relay/消费者在容器内以 nats:4222 访问，8222 需外联时再映射

  redis: # 热状态与限流共享存储：登录限流计数 + 在线成员心跳 ZSET，统一收口到 Redis
    container_name: echat-redis
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-echat}"] # AOF 持久化热状态，重启不丢；requirepass 须与 backend config.yaml 的 redis.password 一致
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-echat} # 供健康检查使用，生产必须用 .env 覆盖
    volumes:
      - echat_prod_redisdata:/data # Redis 持久化目录，重启不丢限流/在线状态
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep PONG"] # 带密码探活
      interval: 5s
      timeout: 3s
      retries: 10
    # 不映射宿主端口：后端经 compose 内部网络以 redis:6379 访问

  # 建库一次性服务：SpiceDB 元数据库必须先存在，migrate 才能连上建表
  # 为什么不能只靠 initdb.d：postgres 官方镜像只在 PGDATA 为空（首次建卷）时执行
  # /docker-entrypoint-initdb.d/*.sh，卷已存在时整段跳过，于是 echat_spicedb 建不出来。
  # 这里每次 up 都用 psql 幂等补建：库在就跳过，不在就 CREATE，新卷老卷都成立。
  spicedb-db-init:
    container_name: echat-spicedb-db-init
    image: postgres:16-alpine   # 复用 postgres 镜像自带的 psql 客户端，不引入新依赖
    restart: "no"               # 一次性任务，成功即退出
    entrypoint: ["/bin/sh", "-c"] # 覆盖 postgres 启动入口，只执行下面的 shell 片段
    command:
      # ${...} 由 compose 在读取文件时插值成真实值，容器里拿到的已是明文，无需 shell 变量
      - |
        psql "postgresql://${POSTGRES_USER:-echat}:${POSTGRES_PASSWORD:-echat}@postgres:5432/postgres" \
          -tAc "SELECT 1 FROM pg_database WHERE datname='echat_spicedb'" | grep -q 1 \
          || psql "postgresql://${POSTGRES_USER:-echat}:${POSTGRES_PASSWORD:-echat}@postgres:5432/postgres" \
             -v ON_ERROR_STOP=1 -c "CREATE DATABASE echat_spicedb OWNER ${POSTGRES_USER:-echat}"
    depends_on:
      postgres:
        condition: service_healthy # 等 Postgres 真正可连再建库

  spicedb-migrate: # 一次性（run --rm）SpiceDB datastore 迁移：serve 不自动建表，须先 migrate head 才可写 schema
    container_name: echat-spicedb-migrate
    # 必须与库里已有的 schema 版本同代（>= 当初迁移它的版本），否则报
    # "unable to find migration for revision: "（迁移链回溯时找不到库里记录的 revision）。
    # 历史沿革：本库最早由 spicedb:latest（v1.56.2）迁移；曾误钉 v1.18.0，老版本不认识新 revision 直接退出。
    # 教训：不要跨大版本降级 SpiceDB，升级可以（向前迁移），降级不行。
    image: ghcr.io/authzed/spicedb:v1.56.2
    restart: "no"
    command: ["migrate", "head"] # 幂等，重复执行无副作用，升级镜像时随 up 自动补齐
    environment:
      SPICEDB_DATASTORE_ENGINE: postgres
      SPICEDB_DATASTORE_CONN_URI: postgres://${POSTGRES_USER:-echat}:${POSTGRES_PASSWORD:-echat}@postgres:5432/echat_spicedb?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy # Postgres 可连即可
      spicedb-db-init:
        condition: service_completed_successfully # echat_spicedb 库由 spicedb-db-init 幂等补建，先保证库存在再迁移

  spicedb: # 对象级授权（Zanzibar）：关系元组存储复用 Postgres（spicedb-db-init 建库 + spicedb-migrate 建表）
    container_name: echat-spicedb
    image: ghcr.io/authzed/spicedb:v1.56.2 # 与 spicedb-migrate 必须同一版本：serve 会校验库内 revision 是否兼容
    restart: unless-stopped
    command: ["serve"]
    environment:
      SPICEDB_GRPC_PRESHARED_KEY: ${SPICEDB_PRESHARED_KEY:-dev-secret-local} # 须与 backend config.yaml 的 spicedb.preshared_key 一致
      SPICEDB_DATASTORE_ENGINE: postgres # 关系元组落 Postgres，不引入新存储
      SPICEDB_DATASTORE_CONN_URI: postgres://${POSTGRES_USER:-echat}:${POSTGRES_PASSWORD:-echat}@postgres:5432/echat_spicedb?sslmode=disable
      SPICEDB_DATASTORE_REVISION_QUANTIZATION: 1s # 降低可读版本推进粒度，控制面强一致读等待上限
    depends_on:
      postgres:
        condition: service_healthy
      spicedb-migrate:
        condition: service_completed_successfully # 元组表迁移落库后才 serve，否则 WriteSchema 报 datastore 内部错误
    # 不映射宿主端口：后端经 compose 内部网络以 spicedb:50051 访问

  migrate: # 一次性（run --rm）Atlas 版本化迁移服务：对线上库 apply backend/migrations，日记表与 store.Migrate 校验对齐
    container_name: echat-migrate
    image: docker.m.daocloud.io/arigaio/atlas:latest # 与 dev 一致走 DaoCloud 镜像加速
    restart: "no"
    command:
      - migrate
      - apply
      - --dir
      - file:///migrations
      - --revisions-schema
      - atlas_schema_revisions
      - --url
      - postgres://${POSTGRES_USER:-echat}:${POSTGRES_PASSWORD:-echat}@postgres:5432/${POSTGRES_DB:-echat}?sslmode=disable
    volumes:
      - ./backend/migrations:/migrations:ro # 只读挂载版本化迁移目录
    depends_on:
      postgres:
        condition: service_healthy

  gateway: # 最外层 HTTPS 入口，负责 TLS 终止并把请求转发给前端容器
    container_name: echat-gateway # 固定容器名，方便 docker ps 和 docker logs 直接定位
    image: nginx:1.27-alpine # 直接使用官方 Nginx 镜像，避免额外维护自定义网关镜像
    restart: unless-stopped # 网关异常退出后自动重启，保证外部入口尽量持续可用
    depends_on:
      - frontend # 先启动前端容器，再启动 HTTPS 网关
    ports:
      - "80:80" # 对外开放 HTTP，用于跳转到 HTTPS
      - "443:443" # 对外开放 HTTPS，浏览器最终通过这个端口访问
    volumes:
      - ./nginx/gateway.prod.conf:/etc/nginx/conf.d/default.conf:ro # 挂载生产网关配置
      - /etc/letsencrypt/live/echat.qxbnx.cn/fullchain.pem:/etc/nginx/ssl/fullchain.pem:ro # 证书公钥链文件
      - /etc/letsencrypt/live/echat.qxbnx.cn/privkey.pem:/etc/nginx/ssl/privkey.pem:ro # 证书私钥文件
      # ACME 验证目录：certbot（在宿主机）把验证文件写到这里，
      # Nginx（在容器内）只读它并返回给 Let's Encrypt 校验。容器只需读，故挂 :ro
      - /var/www/certbot:/var/www/certbot:ro

  backend: # 后端信令服务，供前端通过容器网络访问
    container_name: echat-backend # 固定容器名，方便 docker logs echat-backend 查日志
    image: ${BACKEND_IMAGE}:${IMAGE_TAG} # 本次部署的后端镜像名和 tag，由 CI 写入 .env
    restart: unless-stopped # 容器异常退出后自动重启，手动停止时不强制拉起
    depends_on: # 基础设施就绪后再起后端，避免 relay/连接池空转重试
      postgres:
        condition: service_healthy
      nats:
        condition: service_started
      redis:
        condition: service_healthy
      spicedb:
        condition: service_started
      migrate:
        condition: service_completed_successfully # 迁移成功落库后才能启动，避免首次启动查不到日记表
    volumes:
      - ./backend/config.yaml:/app/config.yaml:ro # 后端唯一配置源：连接地址 + 全部凭据(ASR/TTS/DB/Redis/SpiceDB/JWT)都在此文件,不入 git,直接维护在服务器(以 config.yaml.prod.example 为模板)
      # WebTransport/QUIC 握手证书，与 gateway 共用 Let's Encrypt 续期
      # live/*.pem 是指向 ../../archive/<domain>/*.pem 的相对符号链接，只挂 live 目录会在容器内断链，
      # 因此 archive 同域目录必须一并挂载，链接才能在容器内解析到真实文件
      - /etc/letsencrypt/live/echat.qxbnx.cn:/etc/letsencrypt/live/echat.qxbnx.cn:ro
      - /etc/letsencrypt/archive/echat.qxbnx.cn:/etc/letsencrypt/archive/echat.qxbnx.cn:ro
      # 上传头像持久化到命名卷，重建容器不丢
      - echat_prod_uploads:/app/data/uploads
    expose:
      - "8080" # HTTP/WebSocket 信令端口，仅在 Compose 内部网络暴露，外部经 gateway HTTPS 进入
      - "4433/udp" # WebTransport/QUIC 信令端口，仅在 Compose 内部网络暴露，外部经宿主映射进入
    ports:
      - "50000-50100:50000-50100/udp" # 映射 WebRTC 媒体流 UDP 端口范围到宿主机，浏览器直连必需
      # 映射 WebTransport/QUIC 信令 UDP 端口到宿主机，浏览器直连必需
      # 容器内 QUIC 必须绑 0.0.0.0（webtransport.addr 填 ":4433"）；宿主公网 IP 在 bridge
      # 网络里不存在，填公网 IP 会 bind: cannot assign requested address 导致端点退出
      - "4433:4433/udp"

  frontend: # 前端静态站点和 Nginx 反向代理入口
    container_name: echat-frontend # 固定容器名
    image: ${FRONTEND_IMAGE}:${IMAGE_TAG} # 本次部署的前端镜像名和 tag，由 CI 写入 .env
    restart: unless-stopped # 容器异常退出后自动重启
    depends_on:
      - backend # 先启动后端，再启动前端代理层
    expose:
      - "80" # 只在 Compose 内部网络暴露，外部流量统一经 gateway 进入

  agent: # LLM Agent gRPC 服务，供后端通过容器网络调用
    container_name: echat-agent # 固定容器名
    image: ${AGENT_IMAGE}:${IMAGE_TAG} # 本次部署的 Agent 镜像名和 tag，由 CI 写入 .env
    restart: unless-stopped # 容器异常退出后自动重启
    expose:
      - "50053" # gRPC 端口，仅在 Compose 内部网络暴露
    volumes:
      - ./agent/config.yaml:/app/agent/config.yaml:ro # 挂载 Agent 完整配置（含密钥）

volumes:
  echat_prod_pgdata: # PostgreSQL 数据卷
  echat_prod_natsdata: # NATS JetStream 事件流卷
  echat_prod_redisdata: # Redis 热状态与限流计数持久化卷
  echat_prod_uploads: # 后端上传头像持久化卷（config.yaml uploads.dir 指向 /app/data/uploads）