# 可观测性独立栈：Collector(contrib) + Tempo + Prometheus + Loki + Grafana
# 用法：docker compose -f deploy/docker-compose.dev.yml -f deploy/docker-compose.observability.yml up -d
# 端口：4317/4318(otlp)  8889(collector prometheus)  9090(prometheus)  3200(tempo)  3100(loki)  3000(grafana)
# otel/prometheus/grafana 配置已随部署调整迁往配置仓（多项目单一份），本地以 OBS_DIR 指向
# 配置仓克隆，默认取 app 仓同级的 ../deploy-config/projects/echat（与 local-dev.sh 的解密来源一致）
services:
  otel-collector:
    image: docker.m.daocloud.io/otel/opentelemetry-collector-contrib:latest
    command: ["--config", "/etc/otel/config.yaml"]
    volumes:
      - ${OBS_DIR:-../deploy-config/projects/echat}/otel/collector-config.yaml:/etc/otel/config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
      - "8889:8889"
    depends_on:
      - tempo
      - loki
    restart: unless-stopped

  tempo:
    image: docker.m.daocloud.io/grafana/tempo:latest
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ${OBS_DIR:-../deploy-config/projects/echat}/otel/tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo
    ports:
      - "3200:3200"
    restart: unless-stopped

  prometheus:
    image: docker.m.daocloud.io/prom/prometheus:latest
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=1d"]
    volumes:
      - ${OBS_DIR:-../deploy-config/projects/echat}/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    restart: unless-stopped

  loki:
    image: docker.m.daocloud.io/grafana/loki:latest
    command: ["-config.file=/etc/loki/local-config.yaml"]
    volumes:
      - ${OBS_DIR:-../deploy-config/projects/echat}/otel/loki-config.yaml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    ports:
      - "3100:3100"
    restart: unless-stopped

  grafana:
    image: docker.m.daocloud.io/grafana/grafana:latest
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ${OBS_DIR:-../deploy-config/projects/echat}/grafana/provisioning:/etc/grafana/provisioning:ro
      - ${OBS_DIR:-../deploy-config/projects/echat}/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    restart: unless-stopped
    depends_on:
      - otel-collector

  # 资源层：宿主机/容器 CPU、内存、网络指标（Prometheus 直接抓，不经 Collector）
  node-exporter:
    image: docker.m.daocloud.io/prom/node-exporter:latest
    command: ["--path.rootfs=/host"]
    pid: host
    volumes:
      - /:/host:ro,rslave
    ports:
      - "9100:9100"
    restart: unless-stopped

volumes:
  tempo-data:
  loki-data: